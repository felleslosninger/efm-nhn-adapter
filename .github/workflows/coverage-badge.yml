name: Code coverage badge

on:
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: coverage-badge
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  coverage-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # pin@v6.0.0
        with:
          distribution: liberica
          java-version: 25
          cache: maven
          server-id: github
          server-username-env-var: GH_PACKAGES_READ_USER
          server-password-env-var: GH_PACKAGES_READ_PAT

      - name: Run tests with JaCoCo
        env:
          GH_PACKAGES_READ_USER: ${{ secrets.GH_PACKAGES_READ_USER }}
          GH_PACKAGES_READ_PAT: ${{ secrets.GH_PACKAGES_READ_PAT }}
        run: mvn -B verify

      - name: Generate coverage badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # pin@v2.12.1
        with:
          jacoco-csv-file: nhn-adapter-app/target/site/jacoco/jacoco.csv
          badges-directory: badges
          coverage-label: coverage

      - name: Coverage summary
        env:
          COVERAGE: ${{ steps.jacoco.outputs.coverage }}
          BRANCHES: ${{ steps.jacoco.outputs.branches }}
        run: |
          echo "### Code coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- Instructions: $(awk "BEGIN { printf \"%.1f\", $COVERAGE * 100 }")%" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branches: $(awk "BEGIN { printf \"%.1f\", $BRANCHES * 100 }")%" >> "$GITHUB_STEP_SUMMARY"

      # The badge lives on its own branch so main (protected) is never written to by CI.
      # The commit is made through the GitHub API instead of git push, because the repository
      # rules require verified signatures and GitHub only signs bot commits created via the API.
      - name: Publish badge to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BLOB=$(gh api "repos/$REPO/git/blobs" -f encoding=base64 -f content="$(base64 -w0 badges/jacoco.svg)" --jq .sha)
          TREE=$(jq -n --arg sha "$BLOB" '{tree: [{path: "jacoco.svg", mode: "100644", type: "blob", sha: $sha}]}' \
            | gh api "repos/$REPO/git/trees" --input - --jq .sha)

          if PARENT=$(gh api "repos/$REPO/git/ref/heads/badges" --jq .object.sha 2>/dev/null); then
            if [ "$(gh api "repos/$REPO/git/commits/$PARENT" --jq .tree.sha)" == "$TREE" ]; then
              echo "Badge unchanged"
              exit 0
            fi
          else
            PARENT=""
          fi

          # No author/committer is given, so GitHub signs the commit as github-actions[bot]
          COMMIT=$(jq -n --arg msg "Update coverage badge for ${GITHUB_SHA::7}" --arg tree "$TREE" --arg parent "$PARENT" \
              '{message: $msg, tree: $tree, parents: (if $parent == "" then [] else [$parent] end)}' \
            | gh api "repos/$REPO/git/commits" --input - --jq .sha)

          if [ -n "$PARENT" ]; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/badges" -f sha="$COMMIT" > /dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref=refs/heads/badges -f sha="$COMMIT" > /dev/null
          fi
          echo "Published badge in commit $COMMIT"
