# All external integrations (Maskinporten, AR, FLR, HelseID and MSH) are mocked with MockK in the tests.
# The URLs point to a host that never resolves, so an accidental real call fails fast.
external:
  base-url: "http://external.invalid"

# The limits are small, so that the tests of large chunked requests send little data and finish well within
# limits.max-upload-time. A part above max-in-memory-size is stored on disk, as in production.
spring:
  webflux:
    multipart:
      max-in-memory-size: 256KB
      # As in production: above limits.max-request-size, so that it is the limit of the whole request that applies.
      # Spring Boot 4.2 defaults to 1MB, and to 50 parts.
      max-disk-usage-per-part: 50MB
      max-parts: 10
      file-storage-directory: ${java.io.tmpdir}/efm-nhn-adapter-multipart-test
  # Testcontainers starts MariaDB on the first connection
  datasource:
    url: "jdbc:tc:mariadb:11.4.12:///nhn_adapter"
    username: test
    password: test

digdir:
  audit:
    application-name: nhn-adapter-test
    application-environment: test

security:
  delegation-source: "${external.base-url}/altinn/"
  trusted-issuers:
    - "${external.base-url}/maskinporten"

temp:
  threshold: 10000000
  initial-buffer-size: 100000
  multipart-max-age: 1h

certificate:
  mode: SELF_SIGNED

audit:
  pseudonymization-key: "test-pseudonymization-key-of-at-least-32-characters"

limits:
  # 35MB in production, see the comment on spring.webflux.multipart
  max-request-size: 2MB
  max-dokumentpakke-files: 100
  # 5MB in production. Below max-request-size, as there, so that a request with a Content-Length can be large enough
  # to wait for a permit
  large-send-threshold: 1MB
  max-concurrent-large-sends: 4
  large-send-max-wait: 1s
  max-upload-time: 1s

nhn:
  services:
    ar:
      url: "${external.base-url}/ar"
      timeout:
        connect: 1s
        read: 1s
    flr:
      url: "${external.base-url}/v2/flr"
      username: dummyUser
      password: dummyPass
      timeout:
        connect: 1s
        read: 1s
    msh:
      url: "${external.base-url}"
      timeout:
        connect: 1s
        read: 1s
        request: 1s
      notifications-to-fetch: 50
oauth2:
  helse-id:
    # The private key is generated for each test run by IntegrationTestEnvironment
    client-id: "nhn-adapter-test"
    issuer: "${external.base-url}"
    audience: "${external.base-url}"
    timeout:
      connect: 1s
      read: 1s
