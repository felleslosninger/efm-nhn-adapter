# All external integrations (Maskinporten, AR, FLR, HelseID and MSH) are mocked with MockK in the tests.
# The URLs point to a host that never resolves, so an accidental real call fails fast.
external:
  base-url: "http://external.invalid"

digdir:
  audit:
    application-name: nhn-adapter-test
    application-environment: test

security:
  delegation-source: "${external.base-url}/altinn/"
  trusted-issuers:
    - "${external.base-url}/maskinporten"

temp:
  threshold: 10000000
  initial-buffer-size: 100000

certificate:
  mode: SELF_SIGNED

audit:
  pseudonymization-key: "test-pseudonymization-key-of-at-least-32-characters"

nhn:
  services:
    ar:
      url: "${external.base-url}/ar"
    flr:
      url: "${external.base-url}/v2/flr"
      username: dummyUser
      password: dummyPass
    msh:
      url: "${external.base-url}"
oauth2:
  helse-id:
    # The private key is generated for each test run by IntegrationTestEnvironment
    client-id: "nhn-adapter-test"
    issuer: "${external.base-url}"
    audience: "${external.base-url}"
