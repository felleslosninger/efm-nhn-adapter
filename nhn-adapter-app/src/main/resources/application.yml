---
project:
  application-name: '@pom.name@'
  version: '@project.version@'

spring:
  application:
    # Same name as the image and the deployment; used as the "application" field in the logs
    name: efm-nhn-adapter
  webflux:
    base-path: /nhn-adapter
    multipart:
      # A larger part is buffered on disk, like the dokumentpakke later on (temp.threshold)
      max-in-memory-size: 10MB
      # Limits a chunked request, which has no Content-Length for limits.max-request-size to check
      max-disk-usage-per-part: 50MB
      max-parts: 10
  http:
    codecs:
      max-in-memory-size: 50MB
  web:
    error:
      include-message: never

server:
  port: 8080

management:
  server:
    port: 8090
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      base-path: /
      exposure:
        include: "info,prometheus,health"

digdir:
  audit:
    application-name: no.difi.meldingsutveksling.nhn-adapter:nhn-adapter-app
    application-environment: ${spring.application.environment}
    filters:
      admin-header: false
      bearer-token: true
      ip-address: true
    prometheus:
      counter: true

# A timeout against NHN is reported as 504. "read" is the longest wait for data on an open connection.
nhn:
  services:
    ar:
      timeout:
        connect: 5s
        read: 15s
    flr:
      username: ${NHN_SERVICES_USERNAME}
      password: ${NHN_SERVICES_PASSWORD}
      timeout:
        connect: 5s
        read: 15s
    msh:
      timeout:
        connect: 5s
        read: 30s
        # A whole call, sending a message of up to 50 MB included
        request: 120s

oauth2:
  helse-id:
    client-id: ${NHN_CLIENT_ID}
    private-key: ${NHN_PRIVATE_KEY}
    timeout:
      connect: 5s
      read: 15s

limits:
  # MSH accepts at most 50 MB, so a larger request can never be sent. Checked against Content-Length.
  max-request-size: 50MB
  max-dokumentpakke-files: 100
  # Sends of requests or unpacked dokumentpakker above the threshold are held in memory several times over, and are
  # limited to a few at a time
  large-send-threshold: 5MB
  max-concurrent-large-sends: 4
  # Then answered with 503, so the client tries again later
  large-send-max-wait: 30s
  # Then answered with 408, so that a stalled upload does not keep its permit
  max-upload-time: 120s

audit:
  # HMAC key for pseudonymizing fødselsnummer in the audit log, at least 32 characters. Keep it stable, so that lookups
  # for the same person can be found across releases.
  pseudonymization-key: ${AUDIT_PSEUDONYMIZATION_KEY}

keystore:
  path: ${KEYSTORE_VALUE}
  alias: ${KEYSTORE_ALIAS}
  password: ${KEYSTORE_PASSWORD}
  type: ${KEYSTORE_TYPE:JKS}

logging:
  level:
    org.springframework.http.codec.json: INFO
    org.springframework.core.codec: INFO

temp:
  threshold: 10000000
  initial-buffer-size: 100000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  enable-kotlin: true
  enable-spring-security: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-cloud-platform: 'kubernetes'
    import:
      - 'optional:file:/etc/config/'

