---
project:
  application-name: '@pom.name@'
  version: '@project.version@'

spring:
  application:
    # Same name as the image and the deployment; used as the "application" field in the logs
    name: efm-nhn-adapter
  webflux:
    base-path: /nhn-adapter
    multipart:
      max-in-memory-size: 50MB
  http:
    codecs:
      max-in-memory-size: 50MB
  web:
    error:
      include-message: always

server:
  port: 8080

management:
  server:
    port: 8090
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      base-path: /
      exposure:
        include: "info,prometheus,health"

digdir:
  audit:
    application-name: no.difi.meldingsutveksling.nhn-adapter:nhn-adapter-app
    application-environment: ${spring.application.environment}
    filters:
      admin-header: false
      bearer-token: true
      ip-address: true
    prometheus:
      counter: true

nhn:
  services:
    flr:
      username: ${NHN_SERVICES_USERNAME}
      password: ${NHN_SERVICES_PASSWORD}

oauth2:
  helse-id:
    client-id: ${NHN_CLIENT_ID}
    private-key: ${NHN_PRIVATE_KEY}

audit:
  # HMAC key for pseudonymizing fødselsnummer in the audit log, at least 32 characters. Keep it stable, so that lookups
  # for the same person can be found across releases.
  pseudonymization-key: ${AUDIT_PSEUDONYMIZATION_KEY}

keystore:
  path: ${KEYSTORE_VALUE}
  alias: ${KEYSTORE_ALIAS}
  password: ${KEYSTORE_PASSWORD}
  type: ${KEYSTORE_TYPE:JKS}

logging:
  level:
    org.springframework.http.codec.json: INFO
    org.springframework.core.codec: INFO

temp:
  threshold: 10000000
  initial-buffer-size: 100000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  enable-kotlin: true
  enable-spring-security: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-cloud-platform: 'kubernetes'
    import:
      - 'optional:file:/etc/config/'

